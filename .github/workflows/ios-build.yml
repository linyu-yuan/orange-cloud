name: iOS unsigned build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: apps/ios/Orange Cloud/Orange Cloud.xcodeproj
      SCHEME: Orange Cloud
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Resolve SPM packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" -clonedSourcePackagesDirPath build/spm

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath build/spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) OPENSOURCE_UNLOCKED' \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*fatal|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package IPA
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"; ls "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../OrangeCloud.ipa Payload
          ls -la ../OrangeCloud.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-ipa
          path: OrangeCloud.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
