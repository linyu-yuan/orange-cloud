name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "Cloudflare OAuth client ID (overrides secret CF_OAUTH_CLIENT_ID)"
        required: false
      oauth_redirect_uri:
        description: "https OAuth redirect URI of your callback relay (overrides secret OAUTH_REDIRECT_URI)"
        required: false
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: apps/ios/Orange Cloud/Orange Cloud.xcodeproj
      SCHEME: Orange Cloud
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Override OAuth config (optional)
        env:
          CID: ${{ inputs.oauth_client_id || secrets.CF_OAUTH_CLIENT_ID }}
          RURI: ${{ inputs.oauth_redirect_uri || secrets.OAUTH_REDIRECT_URI }}
        run: |
          F="apps/ios/Orange Cloud/Orange Cloud/Core/Auth/OAuthConfig.swift"
          if [ -n "$CID" ]; then sed -i '' -E "s|(static let clientID = \")[^\"]*|\1$CID|" "$F"; echo "clientID overridden"; fi
          if [ -n "$RURI" ]; then sed -i '' -E "s|(static let redirectURI = \")[^\"]*|\1$RURI|" "$F"; echo "redirectURI overridden"; fi
          grep -nE "clientID =|redirectURI =" "$F" | sed -E 's/"[0-9a-f]{8}[0-9a-f]*"/"<id>"/'

      - name: Resolve SPM packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" -clonedSourcePackagesDirPath build/spm

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath build/spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*fatal|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package IPA
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"; ls "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../OrangeCloud.ipa Payload
          ls -la ../OrangeCloud.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-ipa
          path: OrangeCloud.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
